          } else if (form.kind === 'every') {
            const everyMs = normalizeEveryMs(form.every_ms);
            if (!everyMs || everyMs <= 0) throw new Error('Please provide a positive interval in milliseconds.');
            schedule.every_ms = everyMs;
          } else if (form.kind === 'cron') {
            const expr = (form.expr || '').trim();
            if (!expr) throw new Error('Please provide cron expression.');
            schedule.expr = expr;
            if ((form.tz || '').trim()) schedule.tz = form.tz.trim();
          }

          const created = await api('/cronjobs', {
            method: 'POST',
            body: JSON.stringify({
              name: name,
              session_id: sessionId,
              message: message,
              schedule: schedule,
              enabled: Boolean(form.enabled),
              delete_after_run: Boolean(form.delete_after_run),
            }),
          });
          setBanner('Cron job created.');
          setForm(prev => ({
            ...prev,
            name: '',
            message: '',
            at_local: '',
          }));
          setSelectedJobId(created.id || '');
          await refreshAll({ silent: true });
        } catch (e) {
          setError('Failed to create cron job: ' + e.message);
        } finally {
          setSaving(false);
        }
      }

      async function handleToggleEnabled(job) {
        if (!job || !job.id) return;
        const nextEnabled = !job.enabled;
        setJobAction({ id: job.id, type: 'toggle' });
        setError('');
        setBanner('');
        try {
          await api('/cronjobs/' + encodeURIComponent(job.id) + '/enabled', {
            method: 'POST',
            body: JSON.stringify({ enabled: nextEnabled }),
          });
          setBanner(nextEnabled ? 'Cron job enabled.' : 'Cron job disabled.');
          await refreshAll({ silent: true });
          if (selectedJobId === job.id) await loadRuns(job.id);
        } catch (e) {
          setError('Failed to update job state: ' + e.message);
        } finally {
          setJobAction({ id: '', type: '' });
        }
      }

      async function handleRunNow(job) {
        if (!job || !job.id) return;
        setJobAction({ id: job.id, type: 'run' });
        setError('');
        setBanner('');
        try {
          await api('/cronjobs/' + encodeURIComponent(job.id) + '/run', {
            method: 'POST',
            body: JSON.stringify({ force: true }),
          });
          setBanner('Cron job triggered.');
          await refreshAll({ silent: true });
          if (selectedJobId === job.id) await loadRuns(job.id);
        } catch (e) {
          setError('Failed to run job: ' + e.message);
        } finally {
          setJobAction({ id: '', type: '' });
        }
      }

      async function handleDelete(job) {
        if (!job || !job.id) return;
        const ok = window.confirm('Delete cron job "' + (job.name || job.id) + '"?');
        if (!ok) return;

        setJobAction({ id: job.id, type: 'delete' });
        setError('');
        setBanner('');
        try {
          await api('/cronjobs/' + encodeURIComponent(job.id), { method: 'DELETE' });
          setBanner('Cron job deleted.');
          if (selectedJobId === job.id) {
            setSelectedJobId('');
            setRuns([]);
          }
          await refreshAll({ silent: true });
        } catch (e) {
          setError('Failed to delete job: ' + e.message);
        } finally {
          setJobAction({ id: '', type: '' });
        }
      }

      const enabledJobs = jobs.filter(j => j.enabled).length;
      const selectedJob = jobs.find(j => j.id === selectedJobId) || null;

      if (loading) {
        return html`
          <div class="cronjobs-page">
            <div class="cronjobs-loading"><span class="spinner"></span> Loading cronjobs...</div>
          </div>
        `;
      }

      return html`
        <div class="cronjobs-page">
          <div class="cronjobs-header">
            <div>
              <h2>Cron Jobs</h2>
              <p>Schedule periodic wakeups to inject a message into a session and run the agent loop.</p>
            </div>
            <div class="cronjobs-header-actions">
              <button class="btn btn-sm" onClick=${() => refreshAll({ silent: true })} disabled=${refreshing}>
                ${refreshing ? 'Refreshing...' : 'Refresh'}
              </button>
            </div>
          </div>

          <div class="cronjobs-overview">
            <div class="cronjobs-stat-card">
              <div class="cronjobs-stat-label">Service</div>
              <div class="cronjobs-stat-value">${status && status.running ? 'running' : 'stopped'}</div>
            </div>
            <div class="cronjobs-stat-card">
              <div class="cronjobs-stat-label">Total Jobs</div>
              <div class="cronjobs-stat-value">${jobs.length}</div>
            </div>
            <div class="cronjobs-stat-card">
              <div class="cronjobs-stat-label">Enabled Jobs</div>
              <div class="cronjobs-stat-value">${enabledJobs}</div>
            </div>
            <div class="cronjobs-stat-card">
              <div class="cronjobs-stat-label">Next Wake</div>
              <div class="cronjobs-stat-value cronjobs-stat-time">
                ${status && status.next_wake_at_ms ? formatDateTime(status.next_wake_at_ms) : '-'}
              </div>
            </div>
          </div>

          ${(error || banner) && html`
            <div class="cronjobs-banner ${error ? 'error' : 'success'}">${error || banner}</div>
          `}

          <div class="cronjobs-grid">
            <div class="cronjobs-card">
              <div class="cronjobs-card-header">
                <h3>Create Cron Job</h3>
                <span class="badge">agent_turn</span>
              </div>
              <form class="cronjobs-form" onSubmit=${handleCreateJob}>
                <div class="form-group">
                  <label>Name</label>
                  <input
                    class="input"
                    type="text"
                    value=${form.name}
                    onInput=${(e) => updateForm('name', e.target.value)}
                    placeholder="hourly-summary"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Session</label>
                  <select
                    class="input"
                    value=${form.session_id}
                    onChange=${(e) => updateForm('session_id', e.target.value)}
                    required
                  >
                    <option value="">Select session</option>
                    ${selectedSessionOptions().map(s => html`
                      <option key=${s.id} value=${s.id}>${s.title} (${s.id.slice(0, 8)})</option>
                    `)}
                  </select>
                </div>
                <div class="form-group">
                  <label>Message</label>
                  <textarea
                    class="cronjobs-textarea"
                    value=${form.message}
                    onInput=${(e) => updateForm('message', e.target.value)}
                    placeholder="请总结最近进展并给出下一步计划"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Schedule Type</label>
                  <select class="input" value=${form.kind} onChange=${(e) => updateForm('kind', e.target.value)}>
                    <option value="every">every (interval)</option>
                    <option value="cron">cron (expression)</option>
                    <option value="at">at (one-shot)</option>
                  </select>
                </div>

                ${form.kind === 'every' && html`
                  <div class="form-group">
                    <label>Every (milliseconds)</label>
                    <input
                      class="input"
                      type="number"
                      min="1"
                      step="1"
                      value=${String(form.every_ms)}
                      onInput=${(e) => updateForm('every_ms', e.target.value)}
                      placeholder="3600000"
                    />
                  </div>
                `}

                ${form.kind === 'at' && html`
                  <div class="form-group">
                    <label>Run At (local time)</label>
                    <input
                      class="input"
                      type="datetime-local"
                      value=${form.at_local}
                      onInput=${(e) => updateForm('at_local', e.target.value)}
                    />
                  </div>
                `}

                ${form.kind === 'cron' && html`
                  <div class="form-group">
                    <label>Cron Expression</label>
                    <input
                      class="input"
                      type="text"
                      value=${form.expr}
                      onInput=${(e) => updateForm('expr', e.target.value)}
                      placeholder="0 * * * *"
                    />
                  </div>
                  <div class="form-group">
                    <label>Timezone</label>
                    <input
                      class="input"
                      type="text"
                      value=${form.tz}
                      onInput=${(e) => updateForm('tz', e.target.value)}
                      placeholder="America/Los_Angeles"
                    />
                  </div>
                `}

                <label class="toggle">
                  <input
                    type="checkbox"
                    checked=${form.enabled}
                    onChange=${(e) => updateForm('enabled', e.target.checked)}
                  />
                  Start enabled
                </label>
                <label class="toggle">
                  <input
                    type="checkbox"
                    checked=${form.delete_after_run}
                    onChange=${(e) => updateForm('delete_after_run', e.target.checked)}
                    disabled=${form.kind !== 'at'}
                  />
                  Delete after run (one-shot only)
                </label>

                <div class="form-actions">
                  <button class="btn" type="submit" disabled=${saving}>
                    ${saving ? 'Creating...' : 'Create'}
                  </button>
                </div>
              </form>
            </div>

            <div class="cronjobs-card">
              <div class="cronjobs-card-header">
                <h3>Jobs</h3>
                <select
                  class="input cronjobs-filter-select"
                  value=${filterSessionId}
                  onChange=${(e) => {
                    const next = e.target.value;
                    setFilterSessionId(next);
                    refreshAll({ silent: true, sessionId: next });
                  }}
                >
                  <option value="">All sessions</option>
                  ${selectedSessionOptions().map(s => html`
                    <option key=${s.id} value=${s.id}>${s.title}</option>
                  `)}
                </select>
              </div>

              <div class="cronjobs-job-list">
                ${jobs.length === 0 && html`
                  <div class="cronjobs-empty">
                    <div class="cronjobs-empty-icon">⏰</div>
                    <div class="cronjobs-empty-text">No cron jobs configured</div>
                  </div>
                `}
                ${jobs.map(job => {
                  const selected = selectedJobId === job.id;
                  const busyThis = jobAction.id === job.id;
                  const schedule = scheduleLabel(job);
                  const nextRun = job.state && job.state.next_run_at_ms ? formatDateTime(job.state.next_run_at_ms) : '-';
                  return html`
                    <div key=${job.id} class="cronjobs-job-item ${selected ? 'selected' : ''}">
                      <button class="cronjobs-job-main" onClick=${() => setSelectedJobId(job.id)}>
                        <div class="cronjobs-job-title-row">
                          <span class="cronjobs-job-title">${job.name}</span>
                          <span class="badge ${job.enabled ? 'badge-success' : 'badge-warning'}">
                            ${job.enabled ? 'enabled' : 'disabled'}
                          </span>
                        </div>
                        <div class="cronjobs-job-meta">${schedule}</div>
                        <div class="cronjobs-job-meta">session: ${job.session_id.slice(0, 8)} · next: ${nextRun}</div>
                      </button>
                      <div class="cronjobs-job-actions">
                        <button class="btn btn-sm" onClick=${() => handleRunNow(job)} disabled=${busyThis}>
                          ${busyThis && jobAction.type === 'run' ? 'Running...' : 'Run'}
                        </button>
                        <button class="btn btn-sm ${job.enabled ? 'btn-secondary' : 'btn-success'}" onClick=${() => handleToggleEnabled(job)} disabled=${busyThis}>
                          ${busyThis && jobAction.type === 'toggle' ? 'Saving...' : (job.enabled ? 'Disable' : 'Enable')}
                        </button>
                        <button class="btn btn-sm btn-danger" onClick=${() => handleDelete(job)} disabled=${busyThis}>
                          ${busyThis && jobAction.type === 'delete' ? 'Deleting...' : 'Delete'}
                        </button>
                      </div>
                    </div>
                  `;
                })}
              </div>
            </div>

            <div class="cronjobs-card cronjobs-runs-card">
              <div class="cronjobs-card-header">
                <h3>Run History</h3>
                <div class="cronjobs-card-actions">
                  ${selectedJob && html`<span class="badge">${selectedJob.name}</span>`}
                  <button class="btn btn-sm" onClick=${() => selectedJobId && loadRuns(selectedJobId)} disabled=${!selectedJobId || runsLoading}>
                    ${runsLoading ? 'Loading...' : 'Refresh'}
                  </button>
                </div>
              </div>

              ${!selectedJobId && html`
                <div class="cronjobs-empty">
                  <div class="cronjobs-empty-icon">📜</div>
                  <div class="cronjobs-empty-text">Select a job to view history</div>
                </div>
              `}

              ${selectedJobId && runs.length === 0 && !runsLoading && html`
                <div class="cronjobs-empty">
                  <div class="cronjobs-empty-icon">📭</div>
                  <div class="cronjobs-empty-text">No run history</div>
                </div>
              `}

              ${selectedJobId && runs.length > 0 && html`
                <div class="cronjobs-runs-list">
                  ${runs.map(run => {
                    const statusClass = run.status === 'ok'
                      ? 'badge-success'
                      : (run.status === 'error' ? 'badge-danger' : 'badge-warning');
                    const elapsed = run.finished_at_ms && run.started_at_ms
                      ? formatDuration(run.finished_at_ms - run.started_at_ms)
                      : '-';
                    return html`
                      <div key=${run.id} class="cronjobs-run-item">
                        <div class="cronjobs-run-top">
                          <span class="badge ${statusClass}">${run.status}</span>
                          <span class="cronjobs-run-time">${formatDateTime(run.started_at_ms)}</span>
                          <span class="cronjobs-run-elapsed">${elapsed}</span>
                        </div>
                        <div class="cronjobs-run-meta">
                          <span>run#${run.id}</span>
                          ${run.assistant_message_id && html`<span>msg: ${run.assistant_message_id.slice(0, 10)}</span>`}
                          ${run.trace_id && html`<span>trace: ${run.trace_id.slice(0, 10)}</span>`}
                        </div>
                        ${run.error && html`
                          <div class="cronjobs-run-error">${run.error}</div>
                        `}
                      </div>
                    `;
                  })}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // ============ KnowledgePanel ============
    function KnowledgePanel({ config }) {
      const [activeTab, setActiveTab] = useState('documents');

      // Lift upload state so it persists across tab switches
      const uploadState = useRef({
        // Text mode
        mode: 'text',
        text: '',
        fileSource: '',
        // File mode
        useVlm: false,
        // Shared operation tracking
        uploading: false,
        result: null,
        error: '',
        startTime: null,
        elapsed: null,
        // VLM states
        vlmState: 'idle',
        vlmMarkdown: '',
        vlmError: '',
        vlmFileName: '',
        vlmJobId: null,
        // Direct file upload
        fileName: '',
        // Upload history: [{fileName, status, elapsed, result, error, ts}]
        history: [],
      });
      // A counter to force re-render when uploadState changes
      const [uploadTick, setUploadTick] = useState(0);
      function patchUpload(patch) {
        Object.assign(uploadState.current, patch);
        setUploadTick(t => t + 1);
      }

      // Recover in-progress VLM job from sessionStorage on mount
      useEffect(() => {
        try {
          const saved = sessionStorage.getItem('kb_vlm_job');
          if (!saved) return;
          const job = JSON.parse(saved);
          if (job && job.jobId && job.state === 'parsing') {
            patchUpload({
              vlmState: 'parsing',
              vlmJobId: job.jobId,
              vlmFileName: job.fileName || '',
              startTime: job.startTime || Date.now(),
              elapsed: null,
              error: '',
              vlmError: '',
            });
            // Resume polling
            resumeVlmPoll(job.jobId, job.startTime || Date.now());
          }
        } catch (_) {}
      }, []);

      async function resumeVlmPoll(jobId, startTime) {
        try {
          // Poll VLM parse status by re-calling the SSE endpoint won't work (job already submitted).
          // Instead, periodically poll the backend to check completion.
          // Since our backend only exposes SSE stream, we use a simple retry via /kb/vlm/status
          // However we don't have that endpoint — so we wait for the existing async stream.
          // For now, show a "reconnecting" state. The user can re-upload if the job was lost.
          // Clear sessionStorage since we can't actually resume an SSE stream.
          sessionStorage.removeItem('kb_vlm_job');
          patchUpload({
            vlmState: 'idle',
            vlmError: 'VLM parsing was interrupted (page refresh). Please re-upload the file.',
            startTime: null,
            elapsed: null,
          });
        } catch (_) {}
      }

      if (!config) {
        return html`
          <div class="knowledge-panel">
            <div class="kb-empty">
              <span class="spinner"></span>
              <div class="kb-empty-text" style="margin-top:8px">Loading KB config...</div>
            </div>
          </div>
        `;
      }

      if (!config.enabled) {
        return html`
          <div class="knowledge-panel">
            <div class="kb-empty">
              <div class="kb-empty-icon">\u{1F4DA}</div>
              <div class="kb-empty-text">Knowledge Base is not configured</div>
              <div style="font-size:11px;color:var(--muted);margin-top:8px">
                Set NEXA_KB_BASE_URL in .env to enable.
              </div>
            </div>
          </div>
        `;
      }

      // Show activity indicator on upload tab when busy
      const uploadBusy = uploadState.current.uploading || uploadState.current.vlmState === 'parsing';

      return html`
        <div class="knowledge-panel">
          <div class="kb-tabs">
            <button class="kb-tab ${activeTab === 'documents' ? 'active' : ''}" onClick=${() => setActiveTab('documents')}>Documents</button>
            <button class="kb-tab ${activeTab === 'upload' ? 'active' : ''}" onClick=${() => setActiveTab('upload')}>
              Upload${uploadBusy ? html`<span class="kb-tab-indicator"></span>` : ''}
            </button>
            <button class="kb-tab ${activeTab === 'search' ? 'active' : ''}" onClick=${() => setActiveTab('search')}>Search</button>
          </div>
          <div class="kb-tab-content">
            ${activeTab === 'documents' && html`<${KBDocumentsTab} />`}
            <div style=${activeTab === 'upload' ? '' : 'display:none'}>
              <${KBUploadTab}
                vlmAvailable=${config.vlm_available}
                us=${uploadState.current}
                patchUpload=${patchUpload}
              />
            </div>
            ${activeTab === 'search' && html`<${KBSearchTab} />`}
          </div>
        </div>
      `;
    }

    // ============ KBDocumentsTab ============
    function KBDocumentsTab() {
      const [documents, setDocuments] = useState([]);
      const [page, setPage] = useState(1);
      const [pageSize] = useState(20);
      const [totalCount, setTotalCount] = useState(0);
      const [totalPages, setTotalPages] = useState(0);
      const [statusFilter, setStatusFilter] = useState('');
      const [statusCounts, setStatusCounts] = useState({});
      const [pipeline, setPipeline] = useState(null);
      const [loading, setLoading] = useState(false);
      const [selected, setSelected] = useState(new Set());
      const [deleting, setDeleting] = useState(false);
      const [warning, setWarning] = useState(null);

      async function loadDocuments(p, filter) {
        setLoading(true);
        try {
          const body = { page: p, page_size: pageSize };
          if (filter) body.status_filter = filter;
          const data = await api('/kb/documents/list', {
            method: 'POST',
            body: JSON.stringify(body),
          });
          setDocuments(data.documents || []);
          setPage(data.page || p);
          setTotalCount(data.total_count || 0);
          setTotalPages(data.total_pages || 0);
          setWarning(data.warning || null);
        } catch (e) {
          console.error('KB docs error:', e);
        } finally {
          setLoading(false);
        }
      }

      async function loadCounts() {
        try {
          const data = await api('/kb/status_counts');
          setStatusCounts(data.counts || {});
        } catch (e) { /* ignore */ }
      }

      async function loadPipeline() {
        try {
          const data = await api('/kb/pipeline/status');
          setPipeline(data);
        } catch (e) { /* ignore */ }
      }

      useEffect(() => {
        loadDocuments(1, '');
        loadCounts();
        loadPipeline();
      }, []);

      function handleFilterChange(e) {
        const f = e.target.value;
        setStatusFilter(f);
        setSelected(new Set());
        loadDocuments(1, f);
      }

      function toggleSelect(id) {
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      }

      function toggleSelectAll() {
        if (selected.size === documents.length) {
          setSelected(new Set());
        } else {
          setSelected(new Set(documents.map(d => d.id)));
        }
      }

      async function handleDelete() {
        if (selected.size === 0) return;
        if (!window.confirm('Delete ' + selected.size + ' document(s)?')) return;
        setDeleting(true);
        try {
          await api('/kb/documents', {
            method: 'DELETE',
            body: JSON.stringify({ doc_ids: Array.from(selected) }),
          });
          setSelected(new Set());
          await loadDocuments(page, statusFilter);
          await loadCounts();
        } catch (e) {
          alert('Delete failed: ' + e.message);
        } finally {
          setDeleting(false);
        }
      }

      function refresh() {
        loadDocuments(page, statusFilter);
        loadCounts();
        loadPipeline();
      }

      return html`
        <div>
          ${pipeline && pipeline.busy && html`
            <div class="kb-pipeline kb-pipeline-busy">
              <span class="spinner" style="width:14px;height:14px"></span>
              Pipeline busy: ${pipeline.job_name || 'processing'}
              ${pipeline.docs_current != null && pipeline.docs_total != null
                ? ' (' + pipeline.docs_current + '/' + pipeline.docs_total + ')'
                : ''}
            </div>
          `}

          <div class="kb-status-bar">
            ${Object.entries(statusCounts).map(([status, count]) => html`
              <div key=${status} class="kb-status-item">
                <span class="kb-status ${status.toLowerCase()}">${status}</span>
                <span class="kb-status-count">${count}</span>
              </div>
            `)}
          </div>

          ${warning && html`
            <div class="kb-warning" style="display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:12px;background:rgba(187,128,9,0.1);border:1px solid rgba(187,128,9,0.3);border-radius:6px;font-size:12px;color:#d29922;">
              <span style="flex-shrink:0">&#x26A0;</span>
              <span>${warning}</span>
            </div>
          `}

          <div class="kb-toolbar">
            <div class="kb-toolbar-left">
              <select class="kb-filter-select" value=${statusFilter} onChange=${handleFilterChange}>
                <option value="">All statuses</option>
                <option value="pending">pending</option>
                <option value="processing">processing</option>
                <option value="processed">processed</option>
                <option value="failed">failed</option>
              </select>
              <button class="btn btn-sm btn-danger" onClick=${handleDelete} disabled=${selected.size === 0 || deleting}>
                ${deleting ? 'Deleting...' : 'Delete (' + selected.size + ')'}
              </button>
            </div>
            <button class="icon-btn" onClick=${refresh} title="Refresh" disabled=${loading}>
              ${loading ? '' : '\u21BB'}
              ${loading && html`<span class="spinner" style="width:14px;height:14px"></span>`}
            </button>
          </div>

          ${loading && documents.length === 0 && html`
            <div class="kb-empty">
              <span class="spinner"></span>
              <div class="kb-empty-text" style="margin-top:8px">Loading documents...</div>
            </div>
          `}

          ${!loading && documents.length === 0 && html`
            <div class="kb-empty">
              <div class="kb-empty-icon">\u{1F4C4}</div>
              <div class="kb-empty-text">No documents found</div>
            </div>
          `}

          ${documents.length > 0 && html`
            <table class="kb-doc-table">
              <thead>
                <tr>
                  <th class="doc-checkbox">
                    <input type="checkbox"
                      checked=${selected.size === documents.length && documents.length > 0}
                      onChange=${toggleSelectAll}
                    />
                  </th>
                  <th>Status</th>
                  <th>Summary</th>
                  <th>Length</th>
                  <th>Chunks</th>
                  <th>Source</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody>
                ${documents.map(doc => html`
                  <tr key=${doc.id}>
                    <td class="doc-checkbox">
                      <input type="checkbox"
                        checked=${selected.has(doc.id)}
                        onChange=${() => toggleSelect(doc.id)}
                      />
                    </td>
                    <td><span class="kb-status ${doc.status.toLowerCase()}">${doc.status}</span></td>
                    <td class="doc-summary" title=${doc.content_summary}>${doc.content_summary}</td>
                    <td>${doc.content_length}</td>
                    <td>${doc.chunks_count != null ? doc.chunks_count : '-'}</td>
                    <td>${doc.file_path || '-'}</td>
                    <td>${doc.updated_at || doc.created_at || '-'}</td>
                  </tr>
                `)}
              </tbody>
            </table>

            <div class="kb-pagination">
              <span>Page ${page} of ${totalPages} (${totalCount} total)</span>
              <div style="display:flex;gap:6px">
                <button class="btn btn-sm" onClick=${() => loadDocuments(page - 1, statusFilter)} disabled=${page <= 1 || loading}>Prev</button>
                <button class="btn btn-sm" onClick=${() => loadDocuments(page + 1, statusFilter)} disabled=${page >= totalPages || loading}>Next</button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // ============ KBUploadTab ============
    function KBUploadTab({ vlmAvailable, us, patchUpload }) {
      // Live elapsed-time ticker: updates every second while an operation is running
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        if (!us.startTime) return;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [us.startTime]);

      function fmtElapsed(ms) {
        if (!ms || ms < 0) return '0s';
        const s = Math.floor(ms / 1000);
        if (s < 60) return s + 's';
        const m = Math.floor(s / 60);
        return m + 'm ' + (s % 60) + 's';
      }

      const liveElapsed = us.startTime ? (us.elapsed || (now - us.startTime)) : null;

      // Helper: add completed/failed entry to upload history
      function pushHistory(entry) {
        const hist = [...(us.history || []), { ...entry, ts: Date.now() }];
        // Keep last 20
        if (hist.length > 20) hist.splice(0, hist.length - 20);
        patchUpload({ history: hist });
      }

      // ---- handlers ----

      async function handleTextSubmit(e) {
        e.preventDefault();
        if (!us.text.trim()) return;
        const st = Date.now();
        patchUpload({ uploading: true, error: '', result: null, startTime: st, elapsed: null, fileName: '' });
        try {
          const blob = new Blob([us.text.trim()], { type: 'text/plain' });
          const fname = us.fileSource.trim() || 'manual_input.txt';
          const formData = new FormData();
          formData.append('file', blob, fname);
          const res = await fetch('/kb/documents/upload', { method: 'POST', body: formData });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(err.detail || 'Upload failed');
          }
          const data = await res.json();
          const el = Date.now() - st;
          patchUpload({ result: data, uploading: false, elapsed: el, text: '', fileSource: '' });
          pushHistory({ fileName: us.fileSource.trim() || '(text)', status: data.status, elapsed: el });
        } catch (e) {
          const el = Date.now() - st;
          patchUpload({ error: e.message, uploading: false, elapsed: el });
          pushHistory({ fileName: us.fileSource.trim() || '(text)', status: 'error', error: e.message, elapsed: el });
        }
      }

      async function handleFileUpload(e) {
        e.preventDefault();
        const fileInput = e.target.querySelector('input[type="file"]');
        const file = fileInput && fileInput.files[0];
        if (!file) return;

        if (us.useVlm && vlmAvailable) {
          const st = Date.now();
          patchUpload({ vlmState: 'parsing', vlmError: '', vlmMarkdown: '', vlmFileName: file.name, vlmJobId: null, startTime: st, elapsed: null, result: null, error: '' });

          const formData = new FormData();
          formData.append('file', file);

          try {
            const res = await fetch('/kb/vlm/parse', { method: 'POST', body: formData });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                  const evt = JSON.parse(line.slice(6));
                  if (evt.state === 'submitted' && evt.job_id) {
                    // Save job to sessionStorage so we can detect interrupted parses
                    patchUpload({ vlmJobId: evt.job_id });
                    try {
                      sessionStorage.setItem('kb_vlm_job', JSON.stringify({
                        jobId: evt.job_id, fileName: file.name, startTime: st, state: 'parsing',
                      }));
                    } catch (_) {}
                  } else if (evt.state === 'done') {
                    sessionStorage.removeItem('kb_vlm_job');
                    patchUpload({ vlmMarkdown: evt.markdown || '', vlmState: 'preview', elapsed: Date.now() - st });
                  } else if (evt.state === 'failed') {
                    sessionStorage.removeItem('kb_vlm_job');
                    const el = Date.now() - st;
                    patchUpload({ vlmError: evt.error || 'Parse failed', vlmState: 'idle', elapsed: el });
                    pushHistory({ fileName: file.name, status: 'error', error: evt.error || 'VLM parse failed', elapsed: el });
                  }
                } catch (_) { /* skip */ }
              }
            }
          } catch (e) {
            sessionStorage.removeItem('kb_vlm_job');
            const el = Date.now() - st;
            patchUpload({ vlmError: e.message, vlmState: 'idle', elapsed: el });
            pushHistory({ fileName: file.name, status: 'error', error: e.message, elapsed: el });
          }
        } else {
          const st = Date.now();
          patchUpload({ uploading: true, error: '', result: null, fileName: file.name, startTime: st, elapsed: null });
          const formData = new FormData();
          formData.append('file', file);
          try {
            const res = await fetch('/kb/documents/upload?use_vlm=false', { method: 'POST', body: formData });
            if (!res.ok) {
              const err = await res.json().catch(() => ({ detail: res.statusText }));
              throw new Error(err.detail || 'Upload failed');
            }
            const data = await res.json();
            const el = Date.now() - st;
            patchUpload({ result: data, uploading: false, elapsed: el });
            pushHistory({ fileName: file.name, status: data.status, elapsed: el });
          } catch (e) {
            const el = Date.now() - st;
            patchUpload({ error: e.message, uploading: false, elapsed: el });
            pushHistory({ fileName: file.name, status: 'error', error: e.message, elapsed: el });
          }
        }
      }

      async function handleInsertParsed() {
        if (!us.vlmMarkdown.trim()) return;
        const insertStart = Date.now();
        patchUpload({ vlmState: 'inserting', startTime: insertStart, elapsed: null });
        try {
          const blob = new Blob([us.vlmMarkdown.trim()], { type: 'text/markdown' });
          const fname = (us.vlmFileName || 'vlm-parsed').replace(/\.[^.]+$/, '') + '.md';
          const formData = new FormData();
          formData.append('file', blob, fname);
          const res = await fetch('/kb/documents/upload', { method: 'POST', body: formData });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(err.detail || 'Upload failed');
          }
          const data = await res.json();
          const el = Date.now() - insertStart;
          patchUpload({ result: data, vlmState: 'idle', vlmMarkdown: '', elapsed: el });
          pushHistory({ fileName: us.vlmFileName || 'vlm-parsed', status: data.status, elapsed: el });
        } catch (e) {
          const el = Date.now() - insertStart;
          patchUpload({ vlmError: e.message, vlmState: 'preview', elapsed: el });
        }
      }

      function handleClear() {
        patchUpload({ result: null, error: '', vlmError: '', elapsed: null, startTime: null, fileName: '', vlmFileName: '' });
      }

      function clearHistory() {
        patchUpload({ history: [] });
      }

      // ---- render ----

      const isWorking = us.uploading || us.vlmState === 'parsing' || us.vlmState === 'inserting';
      const hasOutcome = us.result || us.error || us.vlmError;
      const history = us.history || [];

      return html`
        <div class="kb-upload-section">
          <!-- Mode toggle -->
          <div class="kb-upload-mode-toggle">
            <button class="kb-upload-mode-btn ${us.mode === 'text' ? 'active' : ''}"
              onClick=${() => patchUpload({ mode: 'text' })} disabled=${isWorking}>Text</button>
            <button class="kb-upload-mode-btn ${us.mode === 'file' ? 'active' : ''}"
              onClick=${() => patchUpload({ mode: 'file' })} disabled=${isWorking}>File</button>
          </div>

          <!-- Text mode -->
          ${us.mode === 'text' && html`
            <form class="kb-upload-form" onSubmit=${handleTextSubmit}>
              <div class="form-group">
                <label class="kb-field-label">Source name (optional)</label>
                <input class="input" type="text"
                  value=${us.fileSource}
                  onInput=${(e) => patchUpload({ fileSource: e.target.value })}
                  placeholder="my-document.txt"
                  disabled=${isWorking} />
              </div>
              <textarea
                value=${us.text}
                onInput=${(e) => patchUpload({ text: e.target.value })}
                placeholder="Paste text content here..."
                disabled=${isWorking}
              />
              <div class="form-actions">
                <button type="submit" class="btn" disabled=${!us.text.trim() || isWorking}>
                  ${us.uploading ? 'Inserting...' : 'Insert to KB'}
                </button>
              </div>
            </form>
          `}

          <!-- File mode -->
          ${us.mode === 'file' && html`
            <form class="kb-upload-form" onSubmit=${handleFileUpload}>
              <div class="kb-drop-zone">
                <div class="kb-drop-zone-icon">\u{1F4C1}</div>
                <div class="kb-drop-zone-text">Choose a file to upload</div>
                <input type="file" class="kb-file-real-input" disabled=${isWorking} />
              </div>
              ${vlmAvailable && html`
                <label class="kb-vlm-toggle">
                  <input type="checkbox"
                    checked=${us.useVlm}
                    onChange=${(e) => patchUpload({ useVlm: e.target.checked })}
                    disabled=${isWorking} />
                  VLM Enhanced Parsing (PaddleOCR)
                </label>
              `}
              <div class="form-actions">
                <button type="submit" class="btn" disabled=${isWorking}>
                  ${us.uploading ? 'Uploading...' : us.vlmState === 'parsing' ? 'Parsing...' : 'Upload'}
                </button>
              </div>
            </form>
          `}

          <!-- Activity card: shown during or after operations -->
          ${(isWorking || hasOutcome) && html`
            <div class="kb-activity-card ${us.error || us.vlmError ? 'error' : us.result ? 'success' : 'working'}">
              <div class="kb-activity-header">
                <div class="kb-activity-icon">
                  ${isWorking ? html`<span class="spinner" style="width:16px;height:16px"></span>`
                    : us.error || us.vlmError ? '\u2717'
                    : '\u2713'}
                </div>
                <div class="kb-activity-title">
                  ${us.vlmState === 'parsing' ? 'Parsing with VLM'
                    : us.vlmState === 'inserting' ? 'Inserting parsed text'
                    : us.uploading ? 'Uploading'
                    : us.error || us.vlmError ? 'Failed'
                    : us.result ? 'Completed' : ''}
                </div>
                <div class="kb-activity-meta">
                  ${(us.fileName || us.vlmFileName) && html`
                    <span class="kb-activity-file">${us.vlmFileName || us.fileName}</span>
                  `}
                  ${liveElapsed != null && html`
                    <span class="kb-activity-time">${fmtElapsed(liveElapsed)}</span>
                  `}
                </div>
                ${!isWorking && html`
                  <button class="kb-activity-close" onClick=${handleClear} title="Dismiss">\u2715</button>
                `}
              </div>

              ${us.vlmState === 'parsing' && html`
                <div class="kb-progress-bar">
                  <div class="kb-progress-bar-fill kb-progress-indeterminate"></div>
                </div>
              `}

              ${(us.error || us.vlmError) && html`
                <div class="kb-activity-error">${us.error || us.vlmError}</div>
              `}

              ${us.result && html`
                <div class="kb-activity-result">
                  <span class="kb-status ${us.result.status === 'success' ? 'processed' : 'failed'}">${us.result.status}</span>
                  <span>${us.result.message}</span>
                  ${us.result.track_id && html`<span class="kb-activity-track">ID: ${us.result.track_id}</span>`}
                </div>
              `}
            </div>
          `}

          <!-- VLM preview -->
          ${us.vlmState === 'preview' && html`
            <div class="kb-vlm-preview">
              <div class="kb-vlm-preview-header">
                <span>Parsed markdown preview</span>
                <span class="kb-vlm-preview-hint">You can edit before inserting</span>
              </div>
              <textarea
                value=${us.vlmMarkdown}
                onInput=${(e) => patchUpload({ vlmMarkdown: e.target.value })}
              />
              <div class="form-actions" style="margin-top:8px">
                <button class="btn" onClick=${handleInsertParsed}>Insert to KB</button>
                <button class="btn btn-sm" onClick=${() => patchUpload({ vlmState: 'idle', vlmMarkdown: '', vlmFileName: '', startTime: null, elapsed: null })}>
                  Cancel
                </button>
              </div>
            </div>
          `}

          <!-- Upload history -->
          ${history.length > 0 && html`
            <div class="kb-history">
              <div class="kb-history-header">
                <span class="kb-history-title">Upload History</span>
                <button class="kb-activity-close" onClick=${clearHistory} title="Clear history">\u2715</button>
              </div>
              <div class="kb-history-list">
                ${history.slice().reverse().map((h, i) => html`
                  <div key=${i} class="kb-history-item ${h.status === 'error' ? 'error' : ''}">
                    <span class="kb-history-icon">${h.status === 'error' ? '\u2717' : '\u2713'}</span>
                    <span class="kb-history-name" title=${h.fileName}>${h.fileName}</span>
                    <span class="kb-status ${h.status === 'success' ? 'processed' : h.status === 'error' ? 'failed' : 'pending'}">${h.status}</span>
                    <span class="kb-history-elapsed">${fmtElapsed(h.elapsed)}</span>
                  </div>
                `)}
              </div>
            </div>
          `}
        </div>
      `;
    }

    // ============ KBSearchTab ============
    function KBSearchTab() {
      const [query, setQuery] = useState('');
      const [topK, setTopK] = useState(10);
      const [searching, setSearching] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');

      async function handleSearch(e) {
        e.preventDefault();
        if (!query.trim()) return;
        setSearching(true);
        setError('');
        setResult(null);
        try {
          const data = await api('/kb/query', {
            method: 'POST',
            body: JSON.stringify({ query: query.trim(), top_k: topK }),
          });
          setResult(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setSearching(false);
        }
      }

      return html`
        <div>
          <form class="kb-search-form" onSubmit=${handleSearch}>
            <div class="form-group">
              <input
                type="text"
                value=${query}
                onInput=${(e) => setQuery(e.target.value)}
                placeholder="Search the knowledge base..."
              />
            </div>
            <div class="form-group" style="max-width:80px">
              <input
                type="number"
                value=${topK}
                onInput=${(e) => setTopK(parseInt(e.target.value) || 10)}
                min="1" max="100"
                title="Top K results"
                style="padding:8px 12px;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--fg)"
              />
            </div>
            <button type="submit" class="btn" disabled=${!query.trim() || searching}>
              ${searching ? 'Searching...' : 'Search'}
            </button>
          </form>

          ${error && html`<div style="color:var(--danger, #f85149);font-size:12px;margin-bottom:12px">${error}</div>`}

          ${!result && !searching && !error && html`
            <div class="kb-empty">
              <div class="kb-empty-icon">\u{1F50D}</div>
              <div class="kb-empty-text">Enter a query to search the knowledge base</div>
            </div>
          `}

          ${searching && html`
            <div class="kb-empty">
              <span class="spinner"></span>
              <div class="kb-empty-text" style="margin-top:8px">Searching...</div>
            </div>
          `}

          ${result && html`
            <div class="kb-results-section">
              ${result.entities && result.entities.length > 0 && html`
                <div class="kb-results-group">
                  <h4>Entities (${result.entities.length})</h4>
                  <div class="kb-entity-list">
                    ${result.entities.map((e, i) => html`
                      <div key=${i} class="kb-entity-tag" title=${e.description || ''}>
                        <strong>${e.entity_name}</strong>
                        ${e.entity_type && html`<span class="kb-entity-type">${e.entity_type}</span>`}
                      </div>
                    `)}
                  </div>
                </div>
              `}

              ${result.relationships && result.relationships.length > 0 && html`
                <div class="kb-results-group">
                  <h4>Relationships (${result.relationships.length})</h4>
                  <div class="kb-relationship-list">
                    ${result.relationships.map((r, i) => html`
                      <div key=${i} class="kb-relationship-row">
                        <span>${r.src_id}</span>
                        <span class="kb-rel-arrow">\u2192</span>
                        <span>${r.tgt_id}</span>
                        ${r.description && html`<span class="kb-rel-desc">${r.description}</span>`}
                      </div>
                    `)}
                  </div>
                </div>
              `}

              ${result.chunks && result.chunks.length > 0 && html`
                <div class="kb-results-group">
                  <h4>Chunks (${result.chunks.length})</h4>
                  <div class="kb-chunk-list">
                    ${result.chunks.map((ch, i) => html`
                      <div key=${i} class="kb-chunk-card">
                        <div class="kb-chunk-header">
                          <span>Chunk ${i + 1}</span>
                          ${ch.file_path && html`<span>${ch.file_path}</span>`}
                        </div>
                        <div class="kb-chunk-content">${ch.content}</div>
                      </div>
                    `)}
                  </div>
                </div>
              `}

              ${(!result.entities || result.entities.length === 0) &&
                (!result.relationships || result.relationships.length === 0) &&
                (!result.chunks || result.chunks.length === 0) && html`
                <div class="kb-empty">
                  <div class="kb-empty-text">No results found for this query.</div>
                </div>
              `}
            </div>
          `}
        </div>
      `;
    }

    // ============ MainContent ============
    function MainContent({
      sessionId,
      messages,
      parts,
      partsByMessage,
      status,
      todos,
      permissions,
      feedbackByRun,
      onSubmitFeedback,
    }) {
      const [input, setInput] = useState('');
      const [autorun, setAutorun] = useState(true);
      const chatRef = useRef(null);

      const sortedMsgs = useMemo(() => {
        return Array.from(messages.values())
          .filter(m => m.session_id === sessionId && m.role !== 'tool')
          .sort((a, b) => a.created_at - b.created_at);
      }, [messages, sessionId]);

      const activeRunId = useMemo(() => {
        for (let index = sortedMsgs.length - 1; index >= 0; index -= 1) {
          if (sortedMsgs[index].role === 'assistant' && sortedMsgs[index].run_id) {
            return sortedMsgs[index].run_id;
          }
        }
        return null;
      }, [sortedMsgs]);

      const activeRunParts = useMemo(() => {
        if (!activeRunId) return [];
        const messageIds = new Set(sortedMsgs.filter(message => message.run_id === activeRunId).map(message => message.id));
        return Array.from(parts.values()).filter(part => messageIds.has(part.message_id));
      }, [activeRunId, sortedMsgs, parts]);

      useEffect(() => {
        if (chatRef.current) {
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }
      }, [parts, sortedMsgs.length]);

      async function handleSend(e) {
        e.preventDefault();
        if (!input.trim() || !sessionId) return;

        const text = input.trim();
        setInput('');

        try {
          await api('/sessions/' + sessionId + '/messages', {
            method: 'POST',
            body: JSON.stringify({ text: text }),
          });

          if (autorun) {
            await api('/sessions/' + sessionId + '/run', { method: 'POST' });
          }
        } catch (e) {
          alert('Failed to send: ' + e.message);
        }
      }

      async function handleRun() {
        if (!sessionId) return;
        try {
          await api('/sessions/' + sessionId + '/run', { method: 'POST' });
        } catch (e) {
          alert('Failed to run: ' + e.message);
        }
      }

      async function handleInterrupt() {
        if (!sessionId) return;
        try {
          await api('/sessions/' + sessionId + '/interrupt', { method: 'POST' });
        } catch (e) {
          alert('Failed to interrupt: ' + e.message);
        }
      }

      async function handlePermissionReply(reqId, reply) {
        try {
          await api('/permissions/' + reqId + '/reply', {
            method: 'POST',
            body: JSON.stringify({ reply: reply }),
          });
        } catch (e) {
          alert('Failed to reply: ' + e.message);
          throw e;
        }
      }

      if (!sessionId) {
        return html`
          <main class="main-content">
            <div class="chat-empty">
              <div class="chat-empty-icon">🎵</div>
              <div class="chat-empty-title">Welcome to Nexa</div>
              <div class="chat-empty-text">Create or select a session to start chatting</div>
            </div>
          </main>
        `;
      }

      return html`
        <main class="main-content">
          <div class="chat-container">
            <div class="chat-header">
              <div class="chat-header-left">
                <label class="toggle">
                  <input
                    type="checkbox"
                    checked=${autorun}
                    onChange=${(e) => setAutorun(e.target.checked)}
                  />
                  Auto-run
                </label>
              </div>
              <div class="chat-header-right">
                <button class="btn btn-sm" onClick=${handleRun} disabled=${status === 'busy'}>
                  ▶ Run
                </button>
                <button class="btn btn-sm btn-danger" onClick=${handleInterrupt} disabled=${status !== 'busy'}>
                  ⏹ Stop
                </button>
              </div>
            </div>

            <div class="chat-messages" ref=${chatRef}>
              ${sortedMsgs.map(msg => html`
                <${Message}
                  key=${msg.id}
                  message=${msg}
                  parts=${parts}
                  partsByMessage=${partsByMessage}
                  permissions=${permissions}
                  onPermissionReply=${handlePermissionReply}
                  feedback=${msg.run_id ? feedbackByRun.get(msg.run_id) : null}
                  onSubmitFeedback=${onSubmitFeedback}
                />
              `)}

              ${sortedMsgs.length === 0 && html`
                <div class="chat-empty" style="height: auto; padding: 60px 20px;">
                  <div class="chat-empty-text">Send a message to start the conversation</div>
                </div>
              `}
            </div>

            <${RunProgressDock} runId=${activeRunId} status=${status} todos=${todos} runParts=${activeRunParts} />

            <div class="chat-composer">
              <form class="composer-form" onSubmit=${handleSend}>
                <div class="composer-input-wrapper">
                  <textarea
                    class="composer-textarea"
                    value=${input}
                    onInput=${(e) => setInput(e.target.value)}
                    onKeyDown=${(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSend(e);
                      }
                    }}
                    placeholder="Type a message... (Enter to send)"
                    rows="1"
                  />
                </div>
                <button type="submit" class="send-btn" disabled=${!input.trim()}>➤</button>
              </form>
            </div>
          </div>
        </main>
      `;
    }

    // ============ Message ============
    function messagePartBlocks(parts) {
      const blocks = [];
      let activity = [];
      const flushActivity = () => {
        if (activity.length) {
          blocks.push({ type: 'activity', parts: activity });
          activity = [];
        }
      };
      for (const part of parts) {
        if (part.type === 'provider_state') {
          flushActivity();
          continue;
        }
        if (part.type === 'tool' || part.type === 'reasoning') {
          activity.push(part);
          continue;
        }
        flushActivity();
        blocks.push({ type: 'part', part });
      }
      flushActivity();
      return blocks;
    }

    function Message({
      message,
      parts,
      partsByMessage,
      permissions,
      onPermissionReply,
      feedback,
      onSubmitFeedback,
    }) {
      const partIds = partsByMessage.get(message.id) || new Set();
      const msgParts = Array.from(partIds).map(id => parts.get(id)).filter(Boolean);
      const blocks = messagePartBlocks(msgParts);
      const isUser = message.role === 'user';
      const messagePermissions = permissions.filter(p => p.tool && p.tool.message_id === message.id);

      return html`
        <div class="message ${message.role}">
          <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
          <div class="message-content">
            <div class="message-header">
              <span class="message-role">${message.role}</span>
              <span class="message-time">${formatTime(message.created_at)}</span>
              ${message.finish && html`<span class="badge ${message.finish === 'blocked' ? 'badge-warning' : ''}">${message.finish}</span>`}
            </div>
            <div class="message-parts">
              ${blocks.map((block, index) => block.type === 'activity'
                ? html`<${ActivityGroup} key=${'activity-' + index} parts=${block.parts} />`
                : html`<${Part} key=${block.part.id} part=${block.part} />`
              )}
              ${messagePermissions.map(perm => html`
                <${PermissionCard} key=${perm.id} permission=${perm} onReply=${onPermissionReply} />
              `)}
            </div>
            ${!isUser && message.run_id && message.finish && html`
              <${FeedbackControls}
                runId=${message.run_id}
                feedback=${feedback}
                onSubmit=${onSubmitFeedback}
              />
            `}
          </div>
        </div>
      `;
    }

    function FeedbackControls({ runId, feedback, onSubmit }) {
      const [expanded, setExpanded] = useState(false);
      const [types, setTypes] = useState([]);
      const [comment, setComment] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const options = [
        ['incorrect', 'Incorrect'],
        ['incomplete', 'Incomplete'],
        ['instruction_not_followed', 'Missed instruction'],
        ['tool_failure', 'Tool failure'],
        ['unsafe', 'Unsafe'],
        ['outdated', 'Outdated'],
        ['other', 'Other'],
      ];

      async function submit(payload) {
        setLoading(true);
        setError('');
        try {
          await onSubmit(runId, payload);
          setExpanded(false);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      function toggleType(value) {
        setTypes(current => current.includes(value)
          ? current.filter(item => item !== value)
          : [...current, value]);
      }

      if (feedback) {
        return html`
          <div class="message-feedback recorded" title="Feedback is immutable for auditability">
            ${feedback.rating === 'positive' ? 'Helpful' : 'Bad case recorded'}
          </div>
        `;
      }

      return html`
        <div class="message-feedback">
          <div class="feedback-actions">
            <span>Was this result useful?</span>
            <button
              class="feedback-icon-btn"
              title="Helpful"
              disabled=${loading}
              onClick=${() => submit({ rating: 'positive', comment: '' })}
            >Yes</button>
            <button
              class="feedback-icon-btn"
              title="Report a bad case"
              disabled=${loading}
              onClick=${() => setExpanded(!expanded)}
            >No</button>
          </div>
          ${expanded && html`
            <div class="feedback-form">
              <div class="feedback-form-title">What went wrong?</div>
              <div class="feedback-type-grid">
                ${options.map(([value, label]) => html`
                  <label class="feedback-type" key=${value}>
                    <input
                      type="checkbox"
                      checked=${types.includes(value)}
                      onChange=${() => toggleType(value)}
                    />
                    <span>${label}</span>
                  </label>
                `)}
              </div>
              <textarea
                class="input feedback-comment"
                value=${comment}
                maxlength="4000"
                placeholder="Optional context. Secrets and common personal identifiers are redacted before storage."
                onInput=${event => setComment(event.target.value)}
              ></textarea>
              ${error && html`<div class="feedback-error">${error}</div>`}
              <div class="feedback-form-actions">
                <button class="btn btn-sm" onClick=${() => setExpanded(false)}>Cancel</button>
                <button
                  class="btn btn-sm btn-danger"
                  disabled=${loading || types.length === 0}
                  onClick=${() => submit({ rating: 'negative', error_types: types, comment })}
                >${loading ? 'Saving...' : 'Create bad-case candidate'}</button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // ============ Part ============
    function Part({ part }) {
      if (part.type === 'text') {
        return html`
          <div class="message-bubble">
            <div class="message-text" dangerouslySetInnerHTML=${{ __html: renderMd(part.text) }} />
          </div>
        `;
      }
      if (part.type === 'tool') {
        return html`<${ToolCard} part=${part} />`;
      }
      if (part.type === 'reasoning') {
        return html`<${ReasoningPart} part=${part} />`;
      }
      return html`<div class="message-bubble"><pre style="margin:0;font-size:11px">${JSON.stringify(part, null, 2)}</pre></div>`;
    }

    function compactText(value, max = 110) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      return text.length > max ? text.slice(0, max - 1) + '…' : text;
    }

    function fileNameFromPath(value) {
      const path = String(value || '').replace(/\\/g, '/');
      return path.split('/').filter(Boolean).pop() || path;
    }

    function commandPurpose(command) {
      const cmd = String(command || '').trim();
      if (!cmd) return '运行命令';
      if (/\b(pytest|playwright\s+test|npm\s+(run\s+)?test|pnpm\s+(run\s+)?test)\b/i.test(cmd)) return '运行测试';
      if (/\b(ruff|mypy|eslint|tsc|prettier)\b/i.test(cmd)) return '运行代码质量检查';
      if (/\b(rg|grep|findstr)\b/i.test(cmd)) return '搜索项目内容';
      if (/\b(Get-Content|Select-String)\b/i.test(cmd)) return '检索文件内容';
      if (/\b(git\s+(status|diff|log))\b/i.test(cmd)) return '检查工作区变更';
      if (/\b(git\s+(commit|push|merge|rebase))\b/i.test(cmd)) return '执行 Git 操作';
      if (/\b(uv|pip|npm|pnpm)\s+(sync|install|add)\b/i.test(cmd)) return '更新项目依赖';
      return '运行命令';
    }

    function toolActivityView(part) {
      const state = part.state || {};
      const input = state.input || {};
      const tool = String(part.tool || 'tool');
      const path = input.file_path || input.path || input.workdir || '';
      const status = state.status || 'pending';
      let action = tool;
      let subject = '';
      let category = 'other';

      if (tool === 'read') {
        action = '读取文件'; subject = fileNameFromPath(path); category = 'inspect';
      } else if (tool === 'write' || tool === 'edit' || tool === 'apply_patch') {
        action = tool === 'write' ? '写入文件' : '修改文件'; subject = fileNameFromPath(path || state.title); category = 'change';
      } else if (tool === 'grep') {
        action = '搜索内容'; subject = compactText(input.pattern || input.query || '', 72); category = 'inspect';
      } else if (tool === 'glob') {
        action = '查找文件'; subject = compactText(input.pattern || path, 72); category = 'inspect';
      } else if (tool === 'bash') {
        action = commandPurpose(input.command); subject = compactText(input.command, 92); category = /测试|质量|工作区/.test(action) ? 'verify' : 'execute';
      } else if (tool === 'websearch') {
        action = '搜索网页'; subject = compactText(input.query, 78); category = 'research';
      } else if (tool === 'webfetch') {
        action = '读取网页'; subject = compactText(input.url, 78); category = 'research';
      } else if (tool === 'task') {
        action = '委派子任务'; subject = compactText(input.description || input.prompt, 78); category = 'delegate';
      } else if (tool === 'todo' || tool === 'todowrite') {
        action = '更新任务清单'; category = 'plan';
      } else if (tool === 'taskplan') {
        action = '更新执行计划'; subject = compactText(input.title || input.action, 72); category = 'plan';
      } else if (tool.startsWith('mcp_') || tool.includes('__')) {
        action = '调用外部工具'; subject = tool.replace(/^mcp_/, '').replaceAll('__', ' / '); category = 'external';
      }

      const duration = state.time && state.time.end && state.time.start
        ? formatDuration(state.time.end - state.time.start)
        : '';
      return { state, input, tool, status, action, subject, category, duration };
    }

    function activityPhase(toolParts, running, failed) {
      if (failed) return '执行过程中遇到问题';
      const categories = new Set(toolParts.map(part => toolActivityView(part).category));
      const prefix = running ? '正在' : '已完成';
      if (categories.has('change')) return prefix + '更新项目文件';
      if (categories.has('verify')) return prefix + '验证项目状态';
      if (categories.has('research')) return prefix + '检索外部资料';
      if (categories.has('inspect')) return prefix + '检查项目上下文';
      if (categories.has('delegate')) return prefix + '协调子任务';
      if (categories.has('plan')) return prefix + '整理执行计划';
      return running ? '正在执行操作' : '已完成执行操作';
    }

    function ActivityGroup({ parts }) {
      const toolParts = parts.filter(part => part.type === 'tool');
      const reasoningParts = parts.filter(part => part.type === 'reasoning');
      const running = toolParts.some(part => ['pending', 'running'].includes((part.state || {}).status));
      const failed = toolParts.some(part => (part.state || {}).status === 'error');
      const completed = toolParts.filter(part => (part.state || {}).status === 'completed').length;
      const phase = activityPhase(toolParts, running, failed);

      return html`
        <section class="activity-group ${running ? 'running' : ''} ${failed ? 'failed' : ''}">
          <div class="activity-group-header">
            <span class="activity-group-marker">${failed ? '!' : running ? '' : '✓'}</span>
            <div class="activity-group-copy">
              <div class="activity-group-title">${phase}</div>
              <div class="activity-group-meta">${toolParts.length} 项操作${completed ? ` · ${completed} 项完成` : ''}${failed ? ' · 需要检查' : ''}</div>
            </div>
            ${running && html`<span class="activity-live"><span class="spinner"></span> 进行中</span>`}
          </div>
          <div class="activity-list">
            ${toolParts.map(part => html`<${ToolActivityRow} key=${part.id} part=${part} />`)}
          </div>
          ${reasoningParts.length > 0 && html`
            <details class="activity-note">
              <summary>查看工作说明</summary>
              <div>${reasoningParts.map(part => html`<p key=${part.id}>${part.text}</p>`)}</div>
            </details>
          `}
        </section>
      `;
    }

    function ToolActivityRow({ part }) {
      const [expanded, setExpanded] = useState(false);
      const view = toolActivityView(part);
      const isRunning = ['pending', 'running'].includes(view.status);
      const icon = view.status === 'error' ? '×' : isRunning ? '' : '✓';
      return html`
        <div class="activity-row ${view.status}">
          <button class="activity-row-main" onClick=${() => setExpanded(!expanded)} aria-expanded=${expanded}>
            <span class="activity-row-icon">${icon}</span>
            <span class="activity-row-action">${view.action}</span>
            ${view.subject && html`<code class="activity-row-subject" title=${view.subject}>${view.subject}</code>`}
            <span class="activity-row-spacer"></span>
            ${view.duration && html`<span class="activity-row-duration">${view.duration}</span>`}
            ${isRunning && html`<span class="activity-row-status">运行中</span>`}
            ${view.status === 'error' && html`<span class="activity-row-status error">失败</span>`}
            <span class="activity-row-chevron ${expanded ? 'expanded' : ''}">⌄</span>
          </button>
          ${expanded && html`
            <div class="activity-row-details">
              <div class="activity-detail-heading">原始调用 · ${view.tool}</div>
              ${Object.keys(view.input).length > 0 && html`<pre>${JSON.stringify(view.input, null, 2)}</pre>`}
              ${view.status === 'completed' && view.state.output && html`
                <div class="activity-detail-heading">执行结果</div>
                <pre class="result">${view.state.output}</pre>
              `}
              ${view.status === 'error' && view.state.error && html`
                <div class="activity-detail-heading">错误信息</div>
                <pre class="error">${view.state.error}</pre>
              `}
            </div>
          `}
        </div>
      `;
    }

    function RunProgressDock({ runId, status, todos, runParts }) {
      const [workspace, setWorkspace] = useState(null);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        let cancelled = false;
        let timer = null;
        async function refresh() {
          if (!runId) return;
          try {
            const result = await api('/runs/' + encodeURIComponent(runId) + '/workspace');
            if (!cancelled) setWorkspace(result);
          } catch (_) {
            if (!cancelled) setWorkspace(null);
          }
        }
        refresh();
        const hasRunningTool = (Array.isArray(runParts) ? runParts : []).some(part =>
          part.type === 'tool' && ['pending', 'running'].includes((part.state || {}).status)
        );
        if (status === 'busy' || hasRunningTool) timer = window.setInterval(refresh, 4000);
        return () => {
          cancelled = true;
          if (timer) window.clearInterval(timer);
        };
      }, [runId, status, runParts]);

      const items = Array.isArray(todos) ? todos : [];
      const hasRunningTool = (Array.isArray(runParts) ? runParts : []).some(part =>
        part.type === 'tool' && ['pending', 'running'].includes((part.state || {}).status)
      );
      const isActive = status === 'busy' || hasRunningTool;
      const completed = items.filter(item => item.status === 'completed').length;
      const activeIndex = items.findIndex(item => item.status === 'in_progress');
      const step = items.length
        ? Math.max(1, activeIndex >= 0 ? activeIndex + 1 : Math.min(completed + 1, items.length))
        : 0;
      const changes = workspace && workspace.changes && workspace.changes.available ? workspace.changes : null;
      const workspaceFiles = changes && Array.isArray(changes.files) ? changes.files : [];
      const runFiles = Array.from(new Set((Array.isArray(runParts) ? runParts : [])
        .filter(part => part.type === 'tool' && ['write', 'edit', 'apply_patch'].includes(part.tool))
        .map(part => {
          const state = part.state || {};
          const input = state.input || {};
          return input.file_path || input.path || state.title || '';
        })
        .filter(Boolean)));
      if (!runId && !items.length && !isActive) return null;

      return html`
        <div class="run-progress-dock">
          ${open && html`
            <div class="run-progress-popover">
              <div class="run-progress-popover-title">执行进度</div>
              ${items.length > 0 ? html`
                <div class="run-progress-steps">
                  ${items.map((item, index) => html`
                    <div class="run-progress-step ${item.status || 'pending'}" key=${item.id || index}>
                      <span>${item.status === 'completed' ? '✓' : item.status === 'in_progress' ? '' : ''}</span>
                      <div>
                        <strong>${item.content}</strong>
                        ${item.activeForm && item.status === 'in_progress' && html`<small>${item.activeForm}</small>`}
                      </div>
                    </div>
                  `)}
                </div>
              ` : html`<div class="run-progress-empty">${isActive ? 'Agent 正在处理当前任务' : '本轮未创建分步计划'}</div>`}
              ${runFiles.length > 0 && html`
                <div class="run-progress-files">
                  <span>本轮修改 ${runFiles.length} 个文件</span>
                  <code>${runFiles.map(fileNameFromPath).join('、')}</code>
                </div>
              `}
              ${workspaceFiles.length > runFiles.length && html`
                <div class="run-progress-baseline">工作区另有 ${workspaceFiles.length} 个未提交变更，可能包含本轮开始前的改动。</div>
              `}
            </div>
          `}
          <button class="run-progress-pill ${isActive ? 'busy' : ''}" onClick=${() => setOpen(!open)}>
            <span class="run-progress-dot">${isActive ? '' : '✓'}</span>
            <span>${items.length ? `第 ${step} / ${items.length} 步` : isActive ? '正在处理' : '本轮已完成'}</span>
            ${runFiles.length > 0 && html`
              <span class="run-progress-change">· 本轮 ${runFiles.length} 个文件</span>
            `}
            <span class="run-progress-chevron ${open ? 'open' : ''}">⌃</span>
          </button>
        </div>
      `;
    }

    // ============ ToolCard ============
    function ToolCard({ part }) {
      const [expanded, setExpanded] = useState(false);
      const state = part.state || {};
      const status = state.status || 'pending';
      const icons = { pending: '⏳', running: '🔄', completed: '✓', error: '✗' };
      const icon = icons[status] || '🔧';
      const duration = state.time && state.time.end && state.time.start ? formatDuration(state.time.end - state.time.start) : '';
      const shouldCollapse = status === 'completed' && !expanded;

      return html`
        <div class="tool-card ${status}">
          <div class="tool-card-header" onClick=${() => setExpanded(!expanded)}>
            <span class="tool-card-icon">${icon}</span>
            <span class="tool-card-title">${part.tool}</span>
            <div class="tool-card-meta">
              ${duration && html`<span class="tool-card-time">${duration}</span>`}
              ${status === 'running' && html`<span class="spinner"></span>`}
            </div>
            <span class="tool-card-chevron ${expanded ? 'expanded' : ''}">▶</span>
          </div>
          <div class="tool-card-body ${shouldCollapse ? 'collapsed' : ''}">
            ${state.input && html`
              <div class="tool-section">
                <div class="tool-section-label">Input</div>
                <pre class="tool-section-content input">${typeof state.input === 'string' ? state.input : JSON.stringify(state.input, null, 2)}</pre>
              </div>
            `}
            ${status === 'completed' && state.output && html`
              <div class="tool-section">
                <div class="tool-section-label">Output</div>
                <pre class="tool-section-content output">${state.output}</pre>
              </div>
            `}
            ${status === 'error' && state.error && html`
              <div class="tool-section">
                <div class="tool-section-label">Error</div>
                <pre class="tool-section-content error">${state.error}</pre>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ============ ReasoningPart ============
    function ReasoningPart({ part }) {
      const [expanded, setExpanded] = useState(false);
      return html`
        <div class="reasoning-part">
          <div class="reasoning-header" onClick=${() => setExpanded(!expanded)}>
            <span class="reasoning-icon">🤔</span>
            <span class="reasoning-title">Thinking...</span>
            <span class="reasoning-chevron ${expanded ? 'expanded' : ''}">▶</span>
          </div>
          <div class="reasoning-content ${expanded ? '' : 'collapsed'}">${part.text}</div>
        </div>
      `;
    }

    // ============ PermissionCard ============
    function PermissionCard({ permission, onReply }) {
      const [submission, setSubmission] = useState(null);

      async function submit(reply) {
        if (submission) return;
        setSubmission({ status: 'submitting', reply: reply });
        try {
          await onReply(permission.id, reply);
          setSubmission({ status: 'accepted', reply: reply });
        } catch (_error) {
          setSubmission(null);
        }
      }

      const isSubmitting = submission && submission.status === 'submitting';
      const isAccepted = submission && submission.status === 'accepted';
      const actionLabel = submission && submission.reply === 'reject' ? 'Rejection' : 'Approval';

      return html`
        <div class="permission-card ${submission ? 'replying' : ''}">
          <div class="permission-card-header">
            <span class="permission-card-icon">🔐</span>
            <span class="permission-card-title">${submission ? actionLabel + ' submitted' : 'Permission Required'}</span>
          </div>
          <div class="permission-card-body">
            <div class="permission-card-desc"><strong>${permission.permission}</strong> wants to access:</div>
            <pre class="permission-card-content">${(permission.patterns || []).join('\n')}</pre>
            ${permission.metadata && Object.keys(permission.metadata).length > 0 && html`
              <div class="permission-card-meta">${Object.entries(permission.metadata).map(([k, v]) => k + ': ' + v).join(', ')}</div>
            `}
            <div class="permission-card-actions">
              ${submission
                ? html`<div class="permission-card-status" role="status" aria-live="polite">
                    <span class="permission-card-spinner ${isAccepted ? 'accepted' : ''}">${isAccepted ? '✓' : ''}</span>
                    <span>${isSubmitting ? 'Submitting decision…' : 'Decision received. Resuming agent…'}</span>
                  </div>`
                : html`
                    <button class="btn btn-success btn-sm" onClick=${() => submit('once')}>Allow Once</button>
                    <button class="btn btn-sm" onClick=${() => submit('always')}>Always Allow</button>
                    <button class="btn btn-danger btn-sm" onClick=${() => submit('reject')}>Reject</button>
                  `}
            </div>
          </div>
        </div>
      `;
    }

    // ============ ObservabilityPanel ============
    function ObservabilityPanel({
      sessionId,
      events,
      todos,
      tab,
      onTabChange,
      onClearEvents,
      collapsed,
      logFiles,
      selectedLogDate,
      onSelectedLogDateChange,
      logFilters,
      onLogFilterChange,
      onLogSearch,
      onLogReset,
      onLogPrevPage,
      onLogNextPage,
      onRefreshLogs,
      logItems,
      logTotal,
      logOffset,
      logLimit,
      logHasMore,
      logLoading,
      logError,
      expandedLogLineNo,
      onToggleLogExpand,
    }) {
      if (collapsed) {
        return html`
          <aside class="observability-panel" style="width: 48px; min-width: 48px;">
