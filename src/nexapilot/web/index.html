            <div style="writing-mode: vertical-rl; text-align: center; padding: 12px; color: var(--muted); font-size: 12px;">Observability</div>
          </aside>
        `;
      }

      return html`
        <aside class="observability-panel">
          <div class="observability-header">
            <div class="tabs">
              <button class="tab ${tab === 'events' ? 'active' : ''}" onClick=${() => onTabChange('events')}>Events</button>
              <button class="tab ${tab === 'todos' ? 'active' : ''}" onClick=${() => onTabChange('todos')}>Todos</button>
              <button class="tab ${tab === 'logs' ? 'active' : ''}" onClick=${() => onTabChange('logs')}>Logs</button>
              <button class="tab ${tab === 'workspace' ? 'active' : ''}" onClick=${() => onTabChange('workspace')}>Workspace</button>
              <button class="tab ${tab === 'bad-cases' ? 'active' : ''}" onClick=${() => onTabChange('bad-cases')}>Bad cases</button>
            </div>
            ${tab === 'events' && html`<div class="panel-actions"><button class="icon-btn" onClick=${onClearEvents} title="Clear">🗑</button></div>`}
          </div>
          <div class="observability-content">
            ${tab === 'events' && html`<${EventsTab} events=${events} activeSessionId=${sessionId} />`}
            ${tab === 'todos' && html`<${TodosTab} todos=${todos} />`}
            ${tab === 'logs' && html`
              <${LogsTab}
                files=${logFiles}
                selectedDate=${selectedLogDate}
                onSelectedDateChange=${onSelectedLogDateChange}
                filters=${logFilters}
                onFilterChange=${onLogFilterChange}
                onSearch=${onLogSearch}
                onReset=${onLogReset}
                onPrevPage=${onLogPrevPage}
                onNextPage=${onLogNextPage}
                onRefresh=${onRefreshLogs}
                items=${logItems}
                total=${logTotal}
                offset=${logOffset}
                limit=${logLimit}
                hasMore=${logHasMore}
                loading=${logLoading}
                error=${logError}
                expandedLineNo=${expandedLogLineNo}
                onToggleExpand=${onToggleLogExpand}
              />
            `}
            ${tab === 'workspace' && html`
              <${RunWorkspaceTab}
                sessionId=${sessionId}
                refreshKey=${(
                  events.find(evt => evt.type === 'run.state.changed' || (
                    evt.type === 'session.status' && evt.properties && evt.properties.status === 'idle'
                  )) || {}
                ).time || 0}
              />
            `}
            ${tab === 'bad-cases' && html`
              <${BadCasesTab}
                sessionId=${sessionId}
                refreshKey=${(
                  events.find(evt => evt.type === 'evaluation.feedback.created' || evt.type === 'evaluation.candidate.reviewed') || {}
                ).time || 0}
              />
            `}
          </div>
        </aside>
      `;
    }

    function BadCasesTab({ sessionId, refreshKey }) {
      const [status, setStatus] = useState('pending');
      const [candidates, setCandidates] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      async function loadCandidates() {
        if (!sessionId) {
          setCandidates([]);
          return;
        }
        setLoading(true);
        setError('');
        try {
          const params = new URLSearchParams({ session_id: sessionId, status });
          const data = await api('/evaluation/candidates?' + params.toString());
          setCandidates(data.candidates || []);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function review(candidateId, decision) {
        setError('');
        try {
          await api('/evaluation/candidates/' + encodeURIComponent(candidateId) + '/review', {
            method: 'POST',
            body: JSON.stringify({ decision, note: '' }),
          });
          await loadCandidates();
        } catch (e) {
          setError(e.message);
        }
      }

      useEffect(() => { loadCandidates(); }, [sessionId, status]);
      useEffect(() => { if (refreshKey) loadCandidates(); }, [refreshKey]);

      return html`
        <div class="bad-cases-panel">
          <div class="bad-cases-toolbar">
            <select class="input" value=${status} onChange=${event => setStatus(event.target.value)}>
              <option value="pending">Pending review</option>
              <option value="accepted">Accepted cases</option>
              <option value="rejected">Rejected cases</option>
            </select>
            <button class="icon-btn" title="Refresh" onClick=${loadCandidates} disabled=${loading}>↻</button>
          </div>
          <div class="bad-cases-notice">
            Accepting a candidate adds it to the reviewed bad-case pool. It never promotes a failed Run to the trusted baseline.
          </div>
          ${error && html`<div class="logs-error">${error}</div>`}
          ${loading && html`<div class="observability-empty"><span class="spinner"></span><div class="observability-empty-text">Loading feedback...</div></div>`}
          ${!loading && candidates.length === 0 && html`<div class="observability-empty"><div class="observability-empty-text">No ${status} bad cases</div></div>`}
          ${!loading && candidates.map(candidate => html`
            <div class="bad-case-card" key=${candidate.id}>
              <div class="bad-case-header">
                <span class="badge ${candidate.run_status === 'completed' ? '' : 'badge-warning'}">${candidate.run_status}</span>
                <span>${formatDateTime(candidate.created_at)}</span>
              </div>
              <div class="bad-case-types">
                ${candidate.error_types.map(type => html`<span class="badge" key=${type}>${type}</span>`)}
              </div>
              <div class="bad-case-label">Prompt</div>
              <div class="bad-case-text">${candidate.prompt_redacted || '(not captured)'}</div>
              ${candidate.feedback_redacted && html`
                <div class="bad-case-label">Feedback</div>
                <div class="bad-case-text">${candidate.feedback_redacted}</div>
              `}
              ${candidate.status === 'pending' && html`
                <div class="bad-case-actions">
                  <button class="btn btn-sm" onClick=${() => review(candidate.id, 'reject')}>Reject</button>
                  <button class="btn btn-sm btn-success" onClick=${() => review(candidate.id, 'accept')}>Accept case</button>
                </div>
              `}
            </div>
          `)}
        </div>
      `;
    }

    // ============ RunWorkspaceTab ============
    function RunWorkspaceTab({ sessionId, refreshKey }) {
      const [runs, setRuns] = useState([]);
      const [selectedRunId, setSelectedRunId] = useState('');
      const [workspace, setWorkspace] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [section, setSection] = useState('changes');

      async function loadWorkspace(runId, silent = false) {
        if (!runId) {
          setWorkspace(null);
          return;
        }
        if (!silent) setLoading(true);
        setError('');
        try {
          setWorkspace(await api('/runs/' + encodeURIComponent(runId) + '/workspace'));
        } catch (e) {
          setError(e.message);
        } finally {
          if (!silent) setLoading(false);
        }
      }

      async function loadRuns() {
        if (!sessionId) {
          setRuns([]);
          setSelectedRunId('');
          setWorkspace(null);
          return;
        }
        setLoading(true);
        setError('');
        try {
          const data = await api('/sessions/' + encodeURIComponent(sessionId) + '/runs');
          const nextRuns = data.runs || [];
          setRuns(nextRuns);
          const nextId = nextRuns.some(run => run.id === selectedRunId)
            ? selectedRunId
            : (nextRuns[0] && nextRuns[0].id) || '';
          setSelectedRunId(nextId);
          await loadWorkspace(nextId, true);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { loadRuns(); }, [sessionId]);
      useEffect(() => {
        if (refreshKey) loadRuns();
      }, [refreshKey]);

      function selectRun(value) {
        setSelectedRunId(value);
        loadWorkspace(value);
      }

      if (!sessionId) {
        return html`<div class="observability-empty"><div class="observability-empty-text">Select a session to review a Run</div></div>`;
      }

      const changes = workspace && workspace.changes;
      const terminal = (workspace && workspace.terminal) || [];
      const tests = (workspace && workspace.tests) || [];
      const artifacts = (workspace && workspace.artifacts) || [];
      return html`
        <div class="run-workspace">
          <div class="run-workspace-toolbar">
            <select class="input run-workspace-select" value=${selectedRunId} onChange=${e => selectRun(e.target.value)}>
              ${runs.map(run => html`<option key=${run.id} value=${run.id}>#${run.sequence} · ${run.status} · ${shortId(run.id)}</option>`)}
            </select>
            <button class="icon-btn" title="Refresh" onClick=${loadRuns} disabled=${loading}>↻</button>
          </div>
          ${error && html`<div class="logs-error">${error}</div>`}
          ${loading && html`<div class="observability-empty"><span class="spinner"></span><div class="observability-empty-text">Loading Run evidence...</div></div>`}
          ${!loading && runs.length === 0 && html`<div class="observability-empty"><div class="observability-empty-text">No Runs yet</div></div>`}
          ${workspace && !loading && html`
            <div class="run-workspace-summary">
              <span class="badge">${workspace.run.status}</span>
              <span>${changes ? changes.files.length : 0} files</span>
              <span>${terminal.length} commands</span>
              <span>${artifacts.length} artifacts</span>
            </div>
            <div class="run-workspace-tabs">
              ${['changes', 'terminal', 'tests', 'artifacts'].map(name => html`
                <button class="run-workspace-tab ${section === name ? 'active' : ''}" onClick=${() => setSection(name)}>${name}</button>
              `)}
            </div>
            <div class="run-workspace-body">
              ${section === 'changes' && html`<${ChangesView} changes=${changes} />`}
              ${section === 'terminal' && html`<${TerminalView} items=${terminal} />`}
              ${section === 'tests' && html`<${TestsView} items=${tests} />`}
              ${section === 'artifacts' && html`<${ArtifactsView} items=${artifacts} />`}
            </div>
          `}
        </div>
      `;
    }

    function ChangesView({ changes }) {
      if (!changes || !changes.available) {
        return html`<div class="workspace-empty">${(changes && changes.error) || 'Changes unavailable'}</div>`;
      }
      return html`
        <div>
          <div class="workspace-scope">Live worktree snapshot · ${formatDateTime(changes.captured_at)}</div>
          <div class="change-file-list">
            ${changes.files.length === 0 && html`<div class="workspace-empty">Working tree is clean</div>`}
            ${changes.files.map(file => html`<div class="change-file"><span class="change-status ${file.status}">${file.code}</span><span>${file.path}</span></div>`)}
          </div>
          ${changes.diff && html`<pre class="workspace-code workspace-diff">${changes.diff}</pre>`}
        </div>
      `;
    }

    function TerminalView({ items }) {
      if (!items.length) return html`<div class="workspace-empty">No shell commands in this Run</div>`;
      return html`<div class="terminal-list">${items.map(item => html`
        <details class="terminal-item" key=${item.operation_id}>
          <summary><span class="terminal-prompt">$</span><code>${item.command}</code><span class="badge ${item.returncode === 0 ? 'badge-success' : 'badge-danger'}">${item.returncode == null ? item.status : 'exit ' + item.returncode}</span></summary>
          <pre class="workspace-code">${item.output || '(no output)'}</pre>
          ${item.artifact_id && html`<a class="artifact-link" href=${'/artifacts/' + item.artifact_id + '/download'}>Download full output</a>`}
        </details>
      `)}</div>`;
    }

    function TestsView({ items }) {
      if (!items.length) return html`<div class="workspace-empty">No test command detected in this Run</div>`;
      return html`<div class="test-list">${items.map(item => html`
        <div class="test-item ${item.status}"><span class="test-status">${item.status === 'passed' ? '✓' : '✕'}</span><code>${item.command}</code><span>${formatDuration(item.duration_ms)}</span></div>
      `)}</div>`;
    }

    function ArtifactsView({ items }) {
      if (!items.length) return html`<div class="workspace-empty">No large outputs or reports in this Run</div>`;
      return html`<div class="artifact-list">${items.map(item => html`
        <details class="artifact-item" key=${item.id}>
          <summary><span>${item.name}</span><span class="artifact-size">${item.size_bytes} bytes</span></summary>
          <div class="artifact-hash">sha256 ${item.sha256}</div>
          <pre class="workspace-code">${item.preview}</pre>
          <div class="artifact-actions"><a class="artifact-link" href=${item.content_url} target="_blank" rel="noopener">Open</a><a class="artifact-link" href=${item.download_url}>Download</a></div>
        </details>
      `)}</div>`;
    }

    // ============ EventsTab ============
    const RUN_STATE_COPY = {
      queued: ['Queued', 'Waiting for an execution slot', 'pending'],
      acquiring: ['Preparing', 'Acquiring the Run lease and workspace', 'running'],
      running: ['Running', 'The Agent loop is active', 'running'],
      waiting_approval: ['Approval needed', 'Waiting for a user permission decision', 'warning'],
      waiting_retry: ['Retrying', 'Waiting before the next safe attempt', 'warning'],
      recovery_pending: ['Recovering', 'Checking an interrupted Run before continuing', 'warning'],
      cancelling: ['Stopping', 'Cancellation requested; finishing the current safe point', 'warning'],
      completed: ['Completed', 'The Run finished successfully', 'success'],
      failed: ['Failed', 'The Run stopped because of an error', 'danger'],
      cancelled: ['Cancelled', 'The Run was cancelled', 'neutral'],
      interrupted: ['Interrupted', 'Execution stopped before normal completion', 'danger'],
    };

    function humanizeEventType(type) {
      const words = String(type || 'event').replace(/[._-]+/g, ' ');
      return words.charAt(0).toUpperCase() + words.slice(1);
    }

    function compactEventId(value) {
      const text = String(value || '');
      return text.length > 12 ? `${text.slice(0, 8)}…` : text;
    }

    function eventPresentation(evt, context = {}) {
      const type = evt.type || '';
      const props = evt.properties || {};
      const part = props.part || {};
      const state = part.state || {};
      const info = props.info || {};
      const view = {
        icon: '·',
        title: humanizeEventType(type),
        summary: 'Runtime event received',
        status: 'neutral',
        badge: '',
        flow: false,
        technical: false,
        facts: [],
      };

      if (props.run_id) view.facts.push(['Run', compactEventId(props.run_id)]);
      if (props.agent) view.facts.push(['Agent', props.agent]);
      if (props.session_id) view.facts.push(['Session', compactEventId(props.session_id)]);

      if (type === 'session.status') {
        const busy = props.status === 'busy';
        return { ...view, icon: busy ? '▶' : '✓', title: busy ? 'Starting Run' : 'Session ready',
          summary: busy ? 'Loading history, configuration, Memory, and available tools' : 'The session is idle and ready for the next request',
          status: busy ? 'running' : 'success', badge: props.status || '', flow: busy, technical: !busy };
      }
      if (type === 'run.state.changed') {
        const target = props.to || 'running';
        const copy = RUN_STATE_COPY[target] || [humanizeEventType(target), 'Run state changed', 'neutral'];
        const facts = [...view.facts];
        if (props.from) facts.push(['Transition', `${props.from} → ${target}`]);
        if (props.reason) facts.push(['Reason', props.reason]);
        if (props.error_code) facts.push(['Error', props.error_code]);
        return { ...view, icon: copy[2] === 'success' ? '✓' : copy[2] === 'danger' ? '!' : '▶',
          title: `Run ${copy[0].toLowerCase()}`, summary: copy[1], status: copy[2], badge: target,
          flow: true, facts };
      }
      if (type === 'task.started') {
        return { ...view, icon: '↳', title: `Subagent started · ${props.subagent_type || 'agent'}`,
          summary: props.description || 'A delegated task is running in an isolated child session',
          status: 'running', badge: props.subagent_type || 'subagent', flow: true,
          facts: [...view.facts, ['Child session', compactEventId(props.child_session_id)], ['Task call', compactEventId(props.call_id)]] };
      }
      if (type === 'task.finished' || type === 'task.failed') {
        const failed = type === 'task.failed';
        return { ...view, icon: failed ? '!' : '✓', title: `${failed ? 'Subagent stopped' : 'Subagent completed'} · ${props.subagent_type || 'agent'}`,
          summary: failed ? `Delegated task ended with ${props.status || 'an error'}` : 'Delegated findings were returned to the primary Agent',
          status: failed ? 'danger' : 'success', badge: props.status || (failed ? 'failed' : 'completed'), flow: true,
          facts: [...view.facts, ['Child session', compactEventId(props.child_session_id)], ['Task call', compactEventId(props.call_id)]] };
      }
      if (type === 'agent.tool_budget.exhausted') {
        return { ...view, icon: '!', title: `Tool budget reached · ${props.agent || 'agent'}`,
          summary: `Collected evidence is being summarized after ${props.executed_tool_calls || 0}/${props.max_tool_calls || 0} tool calls`,
          status: 'warning', badge: 'finalizing', flow: true,
          facts: [...view.facts, ['Rejected calls', props.rejected_tool_calls]] };
      }
      if (type === 'llm.call.planned') {
        return { ...view, icon: '◇', title: 'Preparing model call',
          summary: `Selected ${props.model || 'the configured model'} using ${props.transport || 'the available transport'}`,
          status: 'running', badge: 'planned', flow: true,
          facts: [...view.facts, ['Model', props.model], ['Transport', props.transport], ['Call', compactEventId(props.call_id)]] };
      }
      if (type === 'llm.attempt.started') {
        return { ...view, icon: '↗', title: 'Waiting for model',
          summary: `Request attempt ${props.attempt || 1} is in flight via ${props.transport || 'provider transport'}`,
          status: 'running', badge: `attempt ${props.attempt || 1}`, flow: true,
          facts: [...view.facts, ['Transport', props.transport], ['Call', compactEventId(props.call_id)]] };
      }
      if (type === 'llm.call.completed') {
        const usage = props.usage || {};
        const tokens = usage.total_tokens || ((usage.input_tokens || 0) + (usage.output_tokens || 0)) || null;
        return { ...view, icon: '✓', title: 'Model response received',
          summary: tokens ? `${tokens.toLocaleString()} tokens processed` : 'The provider completed the model request',
          status: 'success', badge: 'completed', flow: true,
          facts: [...view.facts, ['Model', props.model], ['Transport', props.transport], ['Attempt', props.attempt], ['Tokens', tokens]] };
      }
      if (type === 'llm.attempt.retry_scheduled') {
        return { ...view, icon: '↻', title: 'Model retry scheduled',
          summary: `Attempt ${props.attempt || 1} failed safely; retrying in ${formatDuration(props.delay_ms || 0)}`,
          status: 'warning', badge: 'retry', flow: true,
          facts: [...view.facts, ['Error', props.error_code], ['Delay', formatDuration(props.delay_ms || 0)]] };
      }
      if (type === 'llm.fallback.selected') {
        return { ...view, icon: '⇄', title: 'Switching model transport',
          summary: `${props.from_transport || 'primary'} → ${props.to_transport || 'fallback'} after ${props.reason || 'a provider failure'}`,
          status: 'warning', badge: 'fallback', flow: true, facts: [...view.facts, ['Reason', props.reason]] };
      }
      if (type === 'llm.call.failed' || type === 'llm.call.interrupted' || type === 'llm.circuit.opened') {
        return { ...view, icon: '!', title: type === 'llm.circuit.opened' ? 'Provider circuit opened' : 'Model call failed',
          summary: props.error_code || 'The provider request could not complete', status: 'danger', badge: 'failed', flow: true,
          facts: [...view.facts, ['Error', props.error_code], ['Partial output', props.partial_output]] };
      }
      if (type === 'permission.asked') {
        return { ...view, icon: '?', title: 'Waiting for approval',
          summary: `${props.tool && props.tool.name ? props.tool.name : 'A tool'} needs permission: ${props.permission || 'review required'}`,
          status: 'warning', badge: 'blocked', flow: true,
          facts: [...view.facts, ['Permission', props.permission], ['Patterns', (props.patterns || []).join(', ')]] };
      }
      if (type === 'permission.replied') {
        const rejected = props.reply === 'reject' || props.reply === 'rejected';
        return { ...view, icon: rejected ? '×' : '✓', title: rejected ? 'Approval rejected' : 'Approval granted',
          summary: rejected ? 'The protected tool action will not run' : 'The Agent can continue the protected action',
          status: rejected ? 'danger' : 'success', badge: props.reply || 'answered', flow: true,
          facts: [...view.facts, ['Decision', props.reply], ['Reason', props.reason]] };
      }
      if (type === 'message.part.updated' && part.type === 'tool') {
        const toolStatus = state.status || 'pending';
        const status = toolStatus === 'completed' ? 'success' : toolStatus === 'error' ? 'danger' : 'running';
        const duration = state.time && state.time.end && state.time.start ? formatDuration(state.time.end - state.time.start) : null;
        const titles = { pending: 'Preparing tool', running: 'Executing tool', completed: 'Tool completed', error: 'Tool failed' };
        const summaries = {
          pending: 'Collecting and validating tool arguments',
          running: state.title || 'The tool is currently running',
          completed: state.title || 'The tool returned a result',
          error: state.error || 'The tool returned an error',
        };
        return { ...view, icon: status === 'success' ? '✓' : status === 'danger' ? '!' : '⚙',
          title: `${titles[toolStatus] || 'Tool update'} · ${part.tool || 'unknown'}`,
          summary: summaries[toolStatus] || 'Tool state changed', status, badge: toolStatus, flow: true,
          facts: [...view.facts, ['Tool', part.tool], ['Call', compactEventId(part.call_id)], ['Duration', duration]] };
      }
      if (type === 'message.part.updated' && part.type === 'reasoning') {
        const finished = part.time && part.time.end;
        return { ...view, icon: '◇', title: finished ? 'Reasoning completed' : 'Model reasoning',
          summary: evt.updates > 1 ? `${evt.updates} reasoning stream updates combined` : 'The model is working through the request',
          status: finished ? 'success' : 'running', badge: finished ? 'complete' : 'streaming', flow: true,
          facts: [...view.facts, ['Part', compactEventId(part.id)], ['Updates', evt.updates]] };
      }
      if (type === 'message.part.updated' && part.type === 'text') {
        const messageRole = context.messageRoles && context.messageRoles.get(part.message_id);
        if (messageRole === 'user') {
          return { ...view, icon: '·', title: 'User input stored',
            summary: 'The request content was persisted before execution', status: 'neutral', badge: 'user',
            flow: false, technical: true,
            facts: [...view.facts, ['Part', compactEventId(part.id)], ['Updates', evt.updates]] };
        }
        const finished = part.time && part.time.end;
        return { ...view, icon: '▤', title: finished ? 'Answer content completed' : 'Streaming answer',
          summary: evt.updates > 1 ? `${evt.updates} text stream updates combined` : 'Assistant output is arriving',
          status: finished ? 'success' : 'running', badge: finished ? 'complete' : 'streaming', flow: true,
          facts: [...view.facts, ['Part', compactEventId(part.id)], ['Updates', evt.updates]] };
      }
      if (type === 'message.updated') {
        const completed = Boolean(info.completed_at);
        const role = info.role || 'message';
        return { ...view, icon: completed ? '✓' : '·',
          title: completed && role === 'assistant' ? 'Answer finalized' : `${humanizeEventType(role)} message saved`,
          summary: completed ? `Finished with ${info.finish || 'a completed response'}` : 'Conversation state was persisted',
          status: completed ? 'success' : 'neutral', badge: role, flow: completed && role === 'assistant', technical: !completed,
          facts: [...view.facts, ['Message', compactEventId(info.id)], ['Finish', info.finish]] };
      }
      if (type === 'session.error') {
        const error = props.error || {};
        return { ...view, icon: '!', title: 'Session failed', summary: error.message || 'The session encountered an error',
          status: 'danger', badge: error.type || 'error', flow: true, facts: [...view.facts, ['Type', error.type]] };
      }
      if (type === 'todo.updated') {
        const todos = props.todos || [];
        const completed = todos.filter(item => item.status === 'completed').length;
        return { ...view, icon: '☷', title: 'Plan updated', summary: `${completed}/${todos.length} tasks completed`,
          status: completed === todos.length && todos.length ? 'success' : 'neutral', badge: `${todos.length} tasks`,
          facts: [...view.facts, ['Completed', `${completed}/${todos.length}`]] };
      }
      if (type === 'evaluation.feedback.created') {
        return { ...view, icon: '✓', title: 'Feedback recorded', summary: 'Run feedback was stored for evaluation',
          status: 'success', badge: props.rating || 'saved', facts: [...view.facts, ['Candidate', compactEventId(props.candidate_id)]] };
      }

      view.technical = type.startsWith('message.') || type.startsWith('session.');
      view.summary = type.startsWith('evaluation.') ? 'Evaluation workflow state changed' : 'Runtime detail available';
      return view;
    }

    function EventsTab({ events, activeSessionId }) {
      const [showTechnical, setShowTechnical] = useState(false);
      const [scope, setScope] = useState('current');
      const [agentScope, setAgentScope] = useState('all');
      if (events.length === 0) {
        return html`<div class="observability-empty"><div class="observability-empty-icon">📡</div><div class="observability-empty-text">No events yet</div></div>`;
      }

      const messageRoles = new Map();
      events.forEach(evt => {
        const info = evt.type === 'message.updated' && evt.properties && evt.properties.info;
        if (info && info.id && info.role) messageRoles.set(info.id, info.role);
      });
      const messageRunIds = new Map();
      events.forEach(evt => {
        const info = evt.type === 'message.updated' && evt.properties && evt.properties.info;
        if (info && info.id && info.run_id) messageRunIds.set(info.id, info.run_id);
      });
      const getEventRunId = evt => {
        const props = evt.properties || {};
        const info = props.info || {};
        const part = props.part || {};
        return props.run_id || info.run_id || messageRunIds.get(part.message_id) || null;
      };
      const latestRunId = events
        .filter(evt => (evt.properties || {}).session_id === activeSessionId)
        .map(getEventRunId).find(Boolean) || null;
      const latestRunTimes = latestRunId
        ? events.filter(evt => getEventRunId(evt) === latestRunId).map(evt => evt.startedAt || evt.time)
        : [];
      const latestRunStartedAt = latestRunTimes.length ? Math.min(...latestRunTimes) : 0;
      const presented = events.map(evt => ({ evt, view: eventPresentation(evt, { messageRoles }) }));
      let scoped = scope === 'current' && latestRunId
        ? presented.filter(item => {
            const runId = getEventRunId(item.evt);
            return runId === latestRunId || item.evt.time >= latestRunStartedAt - 2000;
          })
        : presented;
      if (agentScope === 'primary') {
        scoped = scoped.filter(item => (item.evt.properties || {}).session_id === activeSessionId);
      } else if (agentScope === 'subagents') {
        scoped = scoped.filter(item => (item.evt.properties || {}).session_id !== activeSessionId);
      }
      const current = scoped.find(item => item.view.flow) || scoped[0] || presented[0];
      const visible = scoped
        .filter(item => showTechnical || !item.view.technical);

      return html`
        <div class="event-flow">
          <div class="event-current ${current.view.status}">
            <div class="event-current-icon">${current.view.icon}</div>
            <div class="event-current-copy">
              <div class="event-current-label">CURRENT STATE</div>
              <div class="event-current-title">${current.view.title}</div>
              <div class="event-current-summary">${current.view.summary}</div>
            </div>
            ${current.view.badge && html`<span class="event-state-badge ${current.view.status}">${current.view.badge}</span>`}
          </div>

          <div class="event-flow-toolbar">
            <div class="event-scope-switch" role="group" aria-label="Event scope">
              <button class=${scope === 'current' ? 'active' : ''} onClick=${() => setScope('current')} disabled=${!latestRunId}>Current run</button>
              <button class=${scope === 'all' ? 'active' : ''} onClick=${() => setScope('all')}>All</button>
            </div>
            <div class="event-scope-switch" role="group" aria-label="Agent scope">
              <button class=${agentScope === 'all' ? 'active' : ''} onClick=${() => setAgentScope('all')}>All agents</button>
              <button class=${agentScope === 'primary' ? 'active' : ''} onClick=${() => setAgentScope('primary')}>Primary</button>
              <button class=${agentScope === 'subagents' ? 'active' : ''} onClick=${() => setAgentScope('subagents')}>Subagents</button>
            </div>
            <label class="event-technical-toggle">
              <input type="checkbox" checked=${showTechnical} onChange=${event => setShowTechnical(event.target.checked)} />
              Details
            </label>
          </div>
          <div class="event-flow-count">
            ${latestRunId && scope === 'current' ? `Run ${compactEventId(latestRunId)} · ` : ''}${visible.length} steps
          </div>

          <div class="events-timeline">
            ${visible.map(({ evt, view }, i) => html`
              <details key=${evt.key || `${evt.type}-${evt.time}-${i}`} class="event-card ${view.status}">
                <summary class="event-card-summary">
                  <span class="event-timeline-marker">${view.icon}</span>
                  <span class="event-card-copy">
                    <span class="event-card-title-row">
                      <span class="event-card-title">${view.title}</span>
                      ${view.badge && html`<span class="event-state-badge ${view.status}">${view.badge}</span>`}
                    </span>
                    <span class="event-card-description">${view.summary}</span>
                    <span class="event-card-time">${formatTime(evt.time)}${evt.startedAt !== evt.time ? ` · active ${formatDuration(evt.time - evt.startedAt)}` : ''}</span>
                  </span>
                  <span class="event-card-chevron">⌄</span>
                </summary>
                <div class="event-details">
                  ${view.facts.filter(([, value]) => value !== null && value !== undefined && value !== '').map(([label, value]) => html`
                    <div class="event-fact"><span>${label}</span><code>${String(value)}</code></div>
                  `)}
                  <div class="event-raw-label">Technical event · ${evt.type}</div>
                  <pre class="event-raw">${JSON.stringify(evt.properties || {}, null, 2)}</pre>
                </div>
              </details>
            `)}
          </div>
        </div>
      `;
    }

    // ============ TodosTab ============
    function TodosTab({ todos }) {
      if (todos.length === 0) {
        return html`<div class="observability-empty"><div class="observability-empty-icon">📋</div><div class="observability-empty-text">No todos</div></div>`;
      }
      const completed = todos.filter(t => t.status === 'completed').length;
      const percent = Math.round((completed / todos.length) * 100);
      const statusIcon = { pending: '[ ]', in_progress: '[>]', completed: '[x]', cancelled: '[-]' };

      return html`
        <div class="todos-container">
          <div class="todos-header">
            <span class="todos-stats">${completed}/${todos.length}</span>
            <div class="todos-progress"><div class="todos-progress-fill" style="width: ${percent}%"></div></div>
          </div>
          <div class="todos-list">
            ${todos.map(todo => html`
              <div key=${todo.id} class="todo-item ${todo.status === 'in_progress' ? 'in-progress' : ''} ${todo.status} ${todo.priority === 'high' ? 'priority-high' : ''}">
                <span class="todo-icon">${statusIcon[todo.status] || '[ ]'}</span>
                <div class="todo-content">
                  <div class="todo-text">${todo.content}</div>
                  ${todo.status === 'in_progress' && todo.activeForm && html`<div class="todo-active-form">${todo.activeForm}</div>`}
                </div>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    // ============ LogsTab ============
    function LogsTab({
      files,
      selectedDate,
      onSelectedDateChange,
      filters,
      onFilterChange,
      onSearch,
      onReset,
      onPrevPage,
      onNextPage,
      onRefresh,
      items,
      total,
      offset,
      limit,
      hasMore,
      loading,
      error,
      expandedLineNo,
      onToggleExpand,
    }) {
      const levelClass = (level) => String(level || '').toLowerCase();
      const from = total > 0 ? offset + 1 : 0;
      const to = total > 0 ? offset + items.length : 0;

      return html`
        <div class="logs-container">
          <div class="logs-filters">
            <div class="logs-filter-row">
              <label class="logs-filter-label">Date</label>
              <select
                class="input logs-filter-input logs-select"
                value=${selectedDate}
                onChange=${(e) => onSelectedDateChange(e.target.value)}
              >
                <option value="">Select date</option>
                ${files.map(file => html`
                  <option key=${file.date} value=${file.date}>${file.date}</option>
                `)}
              </select>
            </div>
            <div class="logs-filter-row">
              <label class="logs-filter-label">Level</label>
              <select
                class="input logs-filter-input logs-select"
                value=${filters.level}
                onChange=${(e) => onFilterChange('level', e.target.value)}
              >
                <option value="">All</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
              </select>
            </div>
            <div class="logs-filter-row">
              <label class="logs-filter-label">Event</label>
              <input
                class="input logs-filter-input"
                type="text"
                value=${filters.event}
                onInput=${(e) => onFilterChange('event', e.target.value)}
                placeholder="contains..."
              />
            </div>
            <div class="logs-filter-row">
              <label class="logs-filter-label">Session</label>
              <input
                class="input logs-filter-input"
                type="text"
                value=${filters.session_id}
                onInput=${(e) => onFilterChange('session_id', e.target.value)}
                placeholder="exact session_id"
              />
            </div>
            <div class="logs-filter-row">
              <label class="logs-filter-label">Keyword</label>
              <input
                class="input logs-filter-input"
                type="text"
                value=${filters.q}
                onInput=${(e) => onFilterChange('q', e.target.value)}
                placeholder="search all fields"
              />
            </div>
            <div class="logs-filter-actions">
              <button class="btn btn-sm" onClick=${onSearch} disabled=${loading || !selectedDate}>Search</button>
              <button class="btn btn-sm" onClick=${onReset} disabled=${loading}>Reset</button>
              <button class="icon-btn" onClick=${onRefresh} title="Refresh file list" disabled=${loading}>↻</button>
            </div>
          </div>

          ${error && html`<div class="logs-error">${error}</div>`}

          ${loading && html`
            <div class="observability-empty">
              <div class="spinner"></div>
              <div class="observability-empty-text">Loading logs...</div>
            </div>
          `}

          ${!loading && !error && items.length === 0 && html`
            <div class="observability-empty">
              <div class="observability-empty-icon">🗒</div>
              <div class="observability-empty-text">No logs matched</div>
            </div>
          `}

          ${!loading && !error && items.length > 0 && html`
            <div class="logs-list">
              ${items.map(item => html`
                <div key=${item.line_no} class="log-row">
                  <button class="log-row-main" onClick=${() => onToggleExpand(item.line_no)}>
                    <span class="log-time">${formatDateTime(item.ts)}</span>
                    <span class="log-level ${levelClass(item.level)}">${item.level || '-'}</span>
                    <span class="log-event">${item.event || '-'}</span>
                    <span class="log-message-line">${item.message || ''}</span>
                  </button>
                  <div class="log-meta">
                    <span>line ${item.line_no}</span>
                    ${item.session_id && html`<span>sid: ${item.session_id}</span>`}
                    ${item.module && html`<span>${item.module}${item.function ? ':' + item.function : ''}</span>`}
                  </div>
                  ${expandedLineNo === item.line_no && html`
                    <pre class="log-raw">${JSON.stringify(item.raw, null, 2)}</pre>
                  `}
                </div>
              `)}
            </div>
          `}

          <div class="logs-pagination">
            <span class="logs-pagination-stat">${from}-${to} / ${total}</span>
            <div class="logs-pagination-actions">
              <button class="btn btn-sm" onClick=${onPrevPage} disabled=${loading || offset <= 0}>Prev</button>
              <button class="btn btn-sm" onClick=${onNextPage} disabled=${loading || !hasMore}>Next</button>
            </div>
          </div>
        </div>
      `;
    }

    // ============ Mount ============
    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
